spring:
  datasource:
    url: jdbc:h2:mem:checkmatedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

checkmate:
  jwt:
    # 개발 전용 기본 키. prod 프로필에서 이 값(local-dev-only- 접두어)을 쓰면 기동을 거부합니다.
    secret: ${JWT_SECRET:local-dev-only-insecure-jwt-secret-change-me-0123456789}
  seed:
    # LocalDataSeeder 데모 계정 비밀번호
    password: ${CHECKMATE_SEED_PASSWORD:checkmate1234!}

logging:
  level:
    kr.co.checkmate: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO

