apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-evaluator-frontend
  namespace: default
  labels:
    app: hr-evaluator
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hr-evaluator
      tier: frontend
  template:
    metadata:
      labels:
        app: hr-evaluator
        tier: frontend
    spec:
      containers:
        - name: nginx-frontend
          image: ghcr.io/jcm0314/hr-evaluator-frontend:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hr-evaluator-api-gateway
  namespace: default
  labels:
    app: hr-evaluator
    tier: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hr-evaluator
      tier: api-gateway
  template:
    metadata:
      labels:
        app: hr-evaluator
        tier: api-gateway
    spec:
      containers:
        - name: express-gateway
          image: ghcr.io/jcm0314/hr-evaluator-api-gateway:v2.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: hr-evaluator-config
            - secretRef:
                name: hr-evaluator-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
