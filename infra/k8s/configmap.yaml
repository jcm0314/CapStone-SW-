apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-evaluator-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3001"
  CORS_ALLOWED_ORIGINS: "https://hr-evaluator.enterprise.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: hr-evaluator-secrets
  namespace: default
type: Opaque
stringData:
  # Base64 encoded or raw string API keys for GCP Vertex AI / Gemini API
  GEMINI_API_KEY: "YOUR_ENTERPRISE_GCP_GEMINI_API_KEY_HERE"
