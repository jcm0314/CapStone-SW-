apiVersion: v1
kind: Service
metadata:
  name: hr-evaluator-frontend-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hr-evaluator
    tier: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http

---
apiVersion: v1
kind: Service
metadata:
  name: hr-evaluator-gateway-svc
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: hr-evaluator
    tier: api-gateway
  ports:
    - port: 3001
      targetPort: 3001
      name: http-api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hr-evaluator-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: hr-evaluator.enterprise.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: hr-evaluator-gateway-svc
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hr-evaluator-frontend-svc
                port:
                  number: 80
