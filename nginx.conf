server {
    listen 8080;
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API calls must go to the Express gateway (set VITE_API_GATEWAY_URL at build time).
    # Never fall back to index.html for /api/* — return an explicit JSON error instead
    # (previously `error_page 405 =200` turned POST /api/* into a 200 HTML response).
    location /api/ {
        default_type application/json;
        return 404 '{"error":"API_GATEWAY_NOT_ROUTED","message":"This static frontend does not serve /api. Build with VITE_API_GATEWAY_URL pointing to the API gateway."}';
    }

    # Static Assets Caching (JS, CSS, Images, Fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health Check Endpoint for Kubernetes / GCP Cloud Run / Load Balancer
    location /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
