apiVersion: v1
kind: ConfigMap
metadata:
  name: hr-evaluator-config
  namespace: default
data:
  NODE_ENV: "production"
  PORT: "3001"
  CORS_ALLOWED_ORIGINS: "https://hr-evaluator.enterprise.com"

---
apiVersion: v1
kind: Secret
metadata:
  name: hr-evaluator-secrets
  namespace: default
type: Opaque
stringData:
  # Claude API (Anthropic) key for the API gateway (server-side only)
  ANTHROPIC_API_KEY: "YOUR_ANTHROPIC_API_KEY_HERE"
