# GCP VM + Cloudflare Tunnel 배포용 nginx 설정 (deploy/vm/docker-compose.yml 에서 마운트)
# 한 도메인 아래에서 경로로 나눠 같은 출처(same-origin)로 묶습니다.
#   /        → 프론트(정적 파일)
#   /gw/     → AI 게이트웨이(api-gateway:3001)   ← 빌드 시 VITE_API_GATEWAY_URL=https://<도메인>/gw
#   /core/   → Spring 코어 API(core-api:8080)    ← 선택 (core 프로필을 켤 때만)
# 같은 출처라서 CORS 설정이 필요 없고, Cloudflare Access 로그인 하나로 전부 보호됩니다.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 도커 내부 DNS. 컨테이너가 아직 없어도 nginx가 뜨도록 주소를 요청 시점에 찾습니다.
    resolver 127.0.0.11 valid=30s ipv6=off;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_vary on;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;

    # AI 게이트웨이: 평가가 30~60초 걸리므로(서버 타임아웃 120초) 넉넉하게 대기
    location /gw/ {
        set $gw http://api-gateway:3001;
        rewrite ^/gw/(.*)$ /$1 break;
        proxy_pass $gw;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Spring 코어 API (선택)
    location /core/ {
        set $core http://core-api:8080;
        rewrite ^/core/(.*)$ /$1 break;
        proxy_pass $core;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    # 프론트 nginx가 /api/* 에 index.html을 돌려주던 사고(#24) 방지
    location /api/ {
        default_type application/json;
        return 404 '{"error":"API_GATEWAY_NOT_ROUTED","message":"API는 /gw/ 경로로 호출해야 합니다."}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
