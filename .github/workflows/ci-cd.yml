name: HR AX Evaluator Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Automated Unit Testing & Quality Verification
  unit-tests:
    name: 🧪 Automated Vitest Unit Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Vitest Automated Test Suite
        run: npm test

      - name: Verify Production Vite Build Artifacts
        # production 빌드는 게이트웨이 주소가 필수 (#24). 저장소 변수가 없으면 CI 전용 placeholder 사용
        env:
          VITE_API_GATEWAY_URL: ${{ vars.VITE_API_GATEWAY_URL || 'https://api-gateway.ci-placeholder.invalid' }}
        run: npm run build

  # Job 1-b: Spring Boot Core API (server-spring) Unit & Integration Tests
  spring-tests:
    name: ☕ Spring Boot Gradle Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server-spring

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle (dependency cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle Test Suite
        run: ./gradlew test --no-daemon

      - name: Upload Test Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spring-test-reports
          path: server-spring/build/reports/tests/test

  # Job 2: Multi-Stage Docker Container Build Verification
  docker-build:
    name: 🐳 Production Docker Build & Health Check
    needs: [unit-tests, spring-tests]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx Engine
        uses: docker/setup-buildx-action@v3

      - name: Build Frontend Production Nginx Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            VITE_API_GATEWAY_URL=${{ vars.VITE_API_GATEWAY_URL || 'https://api-gateway.ci-placeholder.invalid' }}
          tags: hr-evaluator-frontend:test-latest

      - name: Build Express API Gateway Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: hr-evaluator-api-gateway:test-latest

      - name: Build Spring Boot Core API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: server-spring
          file: server-spring/Dockerfile
          push: false
          tags: checkmate-core-api:test-latest
